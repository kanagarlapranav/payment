name: CI Pipeline

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: "123456789:AAFakePlaceholderBotTokenForTesting35"
      TELEGRAM_USER_ID: "123456789"
      TELEGRAM_GROUP_ID: "-1001234567890"
      DASHBOARD_TOKEN: "fake_test_dashboard_token"
      GEMINI_API_KEY: "AIzaSyFakePlaceholderGeminiApiKeyForTesting35"
      DEFAULT_TIMEZONE: "Asia/Kolkata"
      DAILY_DIGEST_TIME: "22:00"
      RENDER_EXTERNAL_URL: "https://payment-tracker-ci.onrender.com"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Bytecode Compilation (compileall)
        run: |
          python -m compileall .

      - name: Linting with Ruff (Warn only)
        run: |
          ruff check . || true

      - name: Run Unit & Integration Tests with Coverage
        run: |
          pytest --cov=. --cov-report=term-missing

      - name: Verify Ledger Integrity on Database Fixture
        run: |
          python -m tools.check_ledger
