name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Force supported cloud-agent model
        run: |
          echo "COPILOT_AGENT_MODEL=sweagent-capi:gpt-5.6-luna" >> "$GITHUB_ENV"
